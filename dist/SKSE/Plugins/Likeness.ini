; Likeness - a character editor drawn over RaceMenu.
; Most settings can also be changed in game: Apocrypha Menu Framework > Likeness > Settings.

[General]
; 1: draw Likeness over RaceMenu. 0: RaceMenu shows only its own interface.
bEnabled = 1
; 1: Likeness is up when RaceMenu opens. 0: RaceMenu opens in its own interface; the switch key brings Likeness up.
bStartInEditor = 1

[Layout]
; size of the editor's text and controls (0.50 - 2.00)
fScale = 1.00
; share of the screen width the editor takes (0.20 - 0.50)
fPanelWidth = 0.30
; the scene and presets panel on the right
bScenePanel = 1

[Editor]
; Done asks before it finishes the character
bAskBeforeDone = 1
; split long categories into coloured groups
bGroupHeaders = 1
; hide body sliders that clearly belong to the other body type
bHideOtherBodySliders = 1
; a typed value may go past the range a custom body morph registered
bAllowPastRange = 0
; show each slider's internal name and numbers, for mod authors
bShowInternalNames = 0

[Camera]
; degrees the character turns per pixel of drag (0.05 - 2.00)
fTurnSpeed = 0.35

[Controls]
; DirectInput scan code of the key that switches between Likeness and RaceMenu's own interface (0x3E = F4, 0 = none)
iSwitchKey = 0x3E

[Debug]
; 0 trace, 1 debug, 2 info, 3 warnings, 4 errors. Raise to 0 and send Likeness.log with a bug report.
uLogLevel = 2
