; RaceMenu Mirrorwright - a character editor drawn over RaceMenu.
; Most settings can also be changed in game: Apocrypha Menu Framework > RaceMenu Mirrorwright > Settings.

[General]
; 1: draw the editor over RaceMenu. 0: RaceMenu shows only its own interface.
bEnabled = 1
; 1: the editor is up when RaceMenu opens. 0: RaceMenu opens in its own interface; the switch key brings the editor up.
bStartInEditor = 1
; 1: while the editor is up, RaceMenu's own panels are hidden (they come back with the switch key and when the menu closes).
bHideRaceMenuPanels = 1

[Layout]
; size of the editor's text and controls (0.50 - 2.00)
fScale = 1.00
; share of the screen width the editor takes (0.20 - 0.50)
fPanelWidth = 0.30
; the scene and presets panel on the right
bScenePanel = 1

[Editor]
; Done asks before it finishes the character
bAskBeforeDone = 1
; split long categories into coloured groups
bGroupHeaders = 1
; hide body sliders that clearly belong to the other body type
bHideOtherBodySliders = 1
; sliders reach past the range a custom body morph registered
bAllowPastRange = 0
; show each slider's internal name, for mod authors
bShowInternalNames = 0

[Camera]
; degrees the character turns per pixel of drag (0.05 - 2.00)
fTurnSpeed = 0.35

[Controls]
; DirectInput scan code of the key that switches between the editor and RaceMenu's own interface (0x3E = F4, 0 = none)
iSwitchKey = 0x3E

[Advanced]
; 1: a slider handled by the game itself (most stock sliders) is passed to it through the menu's GameDelegate. 0 turns that off.
bGameSliderCalls = 1
; the menu function Done calls, e.g. _root.RaceSexMenuBaseInstance.<name>. Empty: found by name when RaceMenu opens.
sDoneFunction =
; how a race tile is pressed: auto (RaceMenu's own item press), changerace (the game's ChangeRace), or a menu clip path
sRaceRoute = auto

[Debug]
; 0 trace, 1 debug, 2 info, 3 warnings, 4 errors. Raise to 0 and send RaceMenuMirrorwright.log with a bug report.
uLogLevel = 2
